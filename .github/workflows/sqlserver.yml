name: SQL Server synthetic integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlserver:
    runs-on: ubuntu-22.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Synthetic_CI_Only_924!
        ports:
          - 1433:1433
    env:
      MULTI_ASSET_SQLSERVER_TEST_URL: mssql+pyodbc://sa:Synthetic_CI_Only_924!@localhost:1433/PortfolioSyntheticCI?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install SQL Server driver
        run: |
          curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - run: python -m pip install -e '.[dev,sqlserver]'
      - name: Wait for disposable SQL Server and create test database
        run: |
          python - <<'PY'
          import time, pyodbc
          for attempt in range(60):
              try:
                  conn = pyodbc.connect('DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD=Synthetic_CI_Only_924!;TrustServerCertificate=yes', autocommit=True, timeout=2)
                  break
              except pyodbc.Error:
                  if attempt == 59: raise
                  time.sleep(2)
          conn.execute('CREATE DATABASE PortfolioSyntheticCI')
          conn.close()
          PY
      - run: python -m pytest tests/test_sqlserver_integration.py -q
