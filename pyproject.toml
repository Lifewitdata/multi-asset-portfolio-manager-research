[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "multi-asset-lab"
version = "0.1.0"
description = "Historical multi-asset portfolio and active fund research"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<2.4", "statsmodels>=0.14,<0.15", "cvxpy>=1.6,<2", "scikit-learn>=1.5,<2", "dash>=3,<4", "dash-ag-grid>=31,<36", "plotly>=6,<7", "sqlalchemy>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "matplotlib>=3.8,<4"]
sqlserver = ["pyodbc>=5,<6"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"
